 # bop
 # MIO/designers
 # idea
 LST_model_colony: "모범적인 식민지"
 LST_model_colony_desc: "1910년 미시로 자치령이 출범한 이후 필리핀은 자동적으로 독립해 독립국으로 활동했지만, 내부의 혼란한 정국은 국민들로 하여금 외부의 개입을 절실히 요구하는 목소리를 키웠습니다. 유이가오카 제1공화국으로 바뀌어도 안정되지 않던 정국은 대공황이 터지면서, 결국 오토노키자카의 도움을 받기로 하고 1929년 도쿄 조약으로 속령이지만 명칭만 속령인 공화국 체제를 유지하기로 합의했습니다. 그럼에도, 오토노키자카와 유이가오카는 엄청 원만한 관계를 유지하고 있습니다."
 LST_great_depression: "대공황"
 LST_great_depression_desc: "1927년 대공황으로 우리의 수출품을 사는 국가가 하나도 존재하지 않게 되었기에, 우리의 약한 산업은 그 피해를 고스란히 입게 되었습니다."
