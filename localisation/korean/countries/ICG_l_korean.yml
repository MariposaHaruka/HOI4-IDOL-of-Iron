 #####- Section 02: Ideas & National Spirits - #####
 ###################################################
 ICG_great_depression: "대공황"
 ICG_great_depression_desc: "1927년 런던에서 시작된 대공황은 미시로 자치령에도 크게 밀어닥쳐, 미시로 연방의 경제를 크게 위축시켰습니다."
 ICG_widespread_strikes: "만연한 파업"
 ICG_widespread_strikes_desc: "1927년 대공황은 미시로 자치령의 정치에도 크게 영향을 미쳐 매 4년마다 집권당이 바뀌는 결과를 낳았습니다. 그럼에도 해결되지 않는 대공황으로 인해 공산주의 세력이 힘을 키워 올라왔고, 이로 인해 1934년 이후로 대규모 파업이 전국적으로 만연하게 일어나고 있습니다."
 ICG_full_neutral: "오랜 고립주의"
 ICG_full_neutral_desc: "미시로 연방은 남코 연방의 자치령이 되는 대신, 1914년의 대전쟁의 참화에서 비껴가는 행운을 얻었습니다. 한동안 남코 연방의 눈초리를 받았지만 대신 완전한 중립을 길게 유지할 수 있었습니다. 하지만 이 중립이 길게 지속되면서 고립주의로 바뀌었고, 우리 모두 평화주의에 익숙해진 나머지 반전 여론이 강하게 자리잡은지 오래입니다. 하지만 대전쟁이 다가오고 있고, 우리의 고립주의가 여기서도 통용할 수 있는진 미지수입니다."
 ICG_monroe_doctrine_enforcer: "먼로주의의 집행자"
 ICG_monroe_doctrine_enforcer_desc: "예전부터 내려오던 미국의 아메리카 패권, 소위 말하는 먼로 독트린은 1910년의 남코-미시로 협정 당시 양국이 인정했고 이후의 웨스트민스터 헌정에서도 이 항목은 여전히 지켜지고 있습니다.\n\n미시로 연방은 남코 연방과 그 자치령 이외의 국가가 아메리카 대륙에 영향력을 행사할 경우, 이를 견제하기 위해 움직임에 나설 것입니다."
 ICG_wounded_national_pride_idea: "상처 입은 국가적 자존심"
 ICG_wounded_national_pride_idea_desc: "\"어제, 치욕의 날로 기억될 이 날에, 우리는 오토노키자카 해군과 항공대에게 고의적인 기습 공격을 당했습니다.\""
