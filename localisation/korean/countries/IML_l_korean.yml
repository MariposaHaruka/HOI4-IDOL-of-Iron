 ###################################################
 # bop
 # idea
 IML_ratatat: "랏탓타 호황"
 IML_ratatat_1_desc: "최근 5년 동안, 밀리언 연방은 서부 개발로 인한 호황에 힘입어 대공황의 피해를 비껴갈 수 있었고, 이 시대에 유행한 노래의 이름을 딴 랏탓타 호황을 구가하고 있습니다.\n\n§R하지만 지금 상태에서는 전쟁은 먼 주제의 이야기이기 떄문에, 만약 전쟁에 돌입하면 우리의 호황기는 무너지고, 우리도 다른 나라와 마찬가지로 대공황에 빠져 들 수 있습니다.§!"
 IML_ratatat_2_desc: "대공황 기간 동안, 밀리언 연방은 서부 개발로 인한 호황에 힘입어 대공황의 피해를 비껴갈 수 있었고, 이 시대에 유행한 노래의 이름을 딴 랏탓타 호황을 구가하고 있습니다.\n\n§G우리는 호황기에도 철저히 준비를 했고, 이제 그 호황기에 비축한 힘을 적에게 구사할 시간입니다.§!"
 IML_shelter_of_freedom: "자유의 피난처"
 IML_shelter_of_freedom_desc: "대공황으로 미시로 자치령의 정치적 혼란이 가속화되자, 일부 미시로 사람들은 우리나라로 피난을 오기 시작했습니다."
 IML_quebec_problem: "퀘벡 문제"
 IML_quebec_problem_desc: "퀘벡은 밀리언 연방의 다른 주와 달리 역사적 배경이 혼자 다른 지역입니다. 그 탓에 언어와 문화, 정치적 자치권을 둘러싸고 남코 출신인 밀리언 연방의 다른 지역과 사회적 긴장 관계를 이어가고 있습니다."
 IML_national_research_committee: "국가 연구 위원회"
 IML_national_research_committee_desc: "1916년 설립된 국가 연구 위원회는 밀리언 연방의 과학기술 연구를 지원하고 산업 발전을 위한 연구 기반을 마련하고 있습니다."
