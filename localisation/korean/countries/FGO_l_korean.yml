 ###################################################
 # bop
 # MIO/designers
 # idea
 FGO_undiversified_economy: "다각화되지 않은 경제"
 FGO_undiversified_economy_desc: "농업 위주 경제에 집중된 나머지, 1927년 대공황이 닥치자 세계 각국이 우리의 농산물을 더이상 구매하지 않기로 결졍해 우리 경제가 큰 타격을 입었습니다. 우리가 번영하려면 산업을 농업 이외에 여러 분야로 다각화해야 합니다."
 FGO_weak_government: "약한 정부"
 FGO_weak_government_desc: "우리 국가는 노동자 혁명으로 일군 국가이지만, 현재 집권하고 있는 노동자 평의회의 권력은 기존의 지방 세력에 영향력을 미치기엔 아직 영향력이 약한 상태입니다. 그리고 혁명이 지나간 이후 권력을 노리는 이들도 많이 늘어났습니다. 지금 중앙 정부는 어떻게든 얻은 권력을 지켜내야 합니다."
 FGO_home_of_revolution: "혁명의 고향"
 FGO_home_of_revolution_desc: "저 멀리 유럽의 환상향 혁명과 달리, 우리는 순수하게 노동자들과 군인의 협력으로 노동자 혁명을 일궈냈습니다. 우리의 혁명은 진짜 노동자 혁명이고, 이는 전세계적으로 자랑스러운 부분입니다! 노동자 혁명을 하루빨리 전세계에 전파해야 합니다!"
 FGO_disjointed_army: "분열된 군대"
 FGO_disjointed_army_desc: "혁명이 성공한 것엔 중앙 정부의 군대가 분열된 것도 한 몫을 했습니다. 하지만 이 군대를 우리가 관리해야 하는 상황이 왔습니다. 혁명을 일으키는 입장에서 분열된 군대는 우리에게 좋지만, 반대로 국가를 다스리는 입장에서 분열된 군대는 우리나라를 지키기 힘들게 만듭니다. 하루빨리 군대 체제를 개혁해야 합니다."
