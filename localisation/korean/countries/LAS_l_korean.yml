 # bop
 # MIO/designers
 # idea
 LAS_disjointed_command: "분열된 사령부"
 LAS_disjointed_command_desc: "망명정부 상태인 우리는 정부가 앞으로 나아가야할 방향성을 두고 갈라선 상태입니다. 이 차이를 해결하고 오르카를 다시 하나로 뭉치도록 만들어야 합니다."
 LAS_robot_technology_1: "로봇 기술"
 LAS_robot_technology_1_desc: "닥터의 도움을 받은 우리는 로봇 기술을 사용할 수 있습니다. 사람이 부족하면, 로봇으로 대체 할 수 있을지도 모릅니다. \n\n§R하지만 아직은 사람을 대체하기엔 힘들어 보입니다...§!"
 LAS_robot_technology_2_desc: "닥터의 도움을 받은 우리는 로봇 기술을 사용할 수 있습니다. 사람이 부족하면, 로봇으로 대체 할 수 있을지도 모릅니다. \n\n§Y어쩌면 로봇 기술을 조금만 개선하면 보병을 싸게 대체할 수 있을지도 모릅니다.§!"
 LAS_robot_technology_3_desc: "닥터의 도움을 받은 우리는 로봇 기술을 사용할 수 있습니다. 사람이 부족하면, 로봇으로 대체 할 수 있을지도 모릅니다. \n\n§G우리는 지금 많은 수의 보병을 로봇으로 대체해서 완벽하게 전쟁을 수행하고 있습니다!§!"
 LAS_wish_to_go_back_to_home: "집으로 가는 길"
 LAS_wish_to_go_back_to_home_desc: "§R우리는 비록 다른 나라에게 땅을 뺏겨 해외에 나와있지만, 언젠가는 싸워서 이겨내 직접 우리의 땅을 수복할 것입니다.§!"
