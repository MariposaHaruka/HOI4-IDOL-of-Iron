 # idea
 HBR_weak_industry: "열악한 산업"
 HBR_weak_industry_desc: "우리는 갓 독립한 국가가 아닌 국가 중에서 산업력이 크게 떨어지는 국가입니다. 어떻게든 열악한 환경을 극복해야 합니다."
 HBR_khana_ratsadon: "세라프 인민당"
 HBR_khana_ratsadon_desc: "1932년 쿠데타로 집권한 세라프 인민당은 민간 세력과 군부 세력이 합심해 세라프 국을 진보적으로 이끌기 위해 합심한 집단입니다. 하지만 같은 목표만 갖고 성립된 집단이기에 이 균형은 언제 깨질지 아무도 모릅니다."
 HBR_pan_seraph: "대 세라프 주의"
 HBR_pan_seraph_desc: "태국은 20세기 초반 외세로부터 영토를 뜯긴 아픈 역사를 가지고 있습니다. 대공황이 닥친 뒤, 세라프국은 이 강역을 다시 확보할 기회를 갖게 되었습니다. 지금 이 순간이 아니면 어쩌면 다시 예전 영토로 돌아갈 수 없을지도 모릅니다."
 # 인민당 관련
