 # idea
 AZU_north_expedition: "북벌의 열의"
 AZU_north_expedition_desc: "비록 앞선 차례에서 북벌의 시도가 실패했지만, 아직 우리에겐 충분한 열의와 대의가 남아있습니다. 이번 북벌로 진수부를 제거하는데 모두 각오가 되어있는 상태입니다."
 AZU_warlord: "군벌"
 AZU_warlord_desc: "비록 국민당과 이글 유니온이 정권을 잡고 있지만, 로열 네이비와 철혈을 비롯한 많은 세력들이 권력을 쟁취하기 위해 중앙을 노리고 있습니다."
 AZU_nanjing_years: "난징 10년"
 AZU_nanjing_years_desc: "비록 북벌에는 실패했지만 삼민주의의 영향을 받아 1931년 훈정을 실시했고, 이 정치적 안정을 바탕으로 우리는 난징 10년이라 부르는 안정적인 경제성장을 이루는 데 성공했습니다.\n\n하지만 이 성장은 큰 전쟁이 터지면 쉽게 무너질 것입니다. 그리고 오토노키자카는 우리 땅을 넘보고 있습니다. §R시간이 얼마 남지 않았습니다.§!"
