 # bop
 # MIO/designers
 # idea
 ISC_citizen_army: "시민군"
 ISC_citizen_army_desc: "우리의 군대는 시민을 징병해 훈련하는 구조입니다. 호주의 환경은 우리의 군대를 훈련하기에 좋지만, 호주 이외 환경에서 전투하는 경험이 부족하다는 문제가 있습니다."
 ISC_great_depression: "대공황"
 ISC_great_depression_desc: "1927년 대공황은 농업과 철광석 중심 경제였던 우리에 매우 큰 타격을 입혔습니다. 여러 국가가 우리 상품 구매를 줄이면서 많은 사람이 실직했고, 이는 소비자의 구매력 감소로 이어져 다른 산업들마저 붕괴되었습니다. 수년간의 긴축 정책으로 인해 우리는 새로운 방향 전환을 간절히 바라고 있습니다."
 ISC_anzac_spirit: "ANZAC 정신"
 ISC_anzac_spirit_desc: "호주-뉴질랜드 군단(ANZAC)은 대전쟁 중에 제국의 승리를 위해 막대한 노력과 많은 피를 흘리며 뛰어난 명성을 쌓았습니다. 인내력, 용기, 기지, 유머 감각 등 그들의 자질은 분명하게 드러났으며, 위험과 고난 속에서도 태연하게 맞서는 모습까지 모두 뛰어났습니다. 호주군을 계승한 츠바사군에게도, 이 정신은 그대로 전해져오고 있습니다."
 ISC_indigenous_problem: "원주민 문제"
 ISC_indigenous_problem_desc: "호주 시절부터 존재했던 백호주의는 츠바사 연방의 출범과 대공황을 거치면서 법적으로 없어졌지만, 아직도 호주 원주민의 차별 관련해서 진통이 남아있는 상황입니다."
