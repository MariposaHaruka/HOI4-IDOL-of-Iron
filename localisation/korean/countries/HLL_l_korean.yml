 # bop
 # MIO/designers
 # idea
 HLL_unstable_government: "불안정한 권력"
 HLL_unstable_government_desc: "1922년을 전후해 홀로라이브가 베네수엘라에 집권한 이후, 홀로라이브 내에서의 권력 암투는 20년 넘게 지속되어 왔습니다. 우사다 페코라가 집권한지 5년 되어서 혼란은 어느 정도 가라앉았지만, 아직도 페코라는 불안정한 권력을 쥐고 있습니다."
 HLL_4year_plan: "4개년 계획"
 HLL_4year_plan_desc: "홀로라이브가 집권한 이래, 석유 경제를 바탕으로 국가의 산업화를 위해 4개년 계획을 진행하고 있습니다."
 HLL_oil_economy: "석유 경제"
 HLL_oil_economy_desc: "대공황을 거치면서 우리나라의 경제 핵심은 농업에서 석유 채굴로 이동했습니다. 하지만 그 덕에 제조업과 중공업의 기반이 다른 나라에 비해 부족한 편입니다."
 HLL_democratic_movement: "민주화 요구"
 HLL_democratic_movement_desc: "홀로라이브 내에서의 다양한 정치적 의견과 개혁 정책은 국민들에게 민주화 요구로 받아들여지고 있습니다. 실제로 극소수의 일부 국민들은 민주화 요구 시위를 벌이고 있는 상황입니다."
