 # idea
 RST_mismanaged_admin: "부실한 행정"
 RST_mismanaged_admin_desc: "동인도 제도는 수백 가지의 서로 다른 문화와 언어가 공존하는 광활한 제도로, 식민지 시절부터 행정이 매우 어려운 식민지로 악명이 높았습니다. 독립 이후에도 이는 변하지 않았고, 이러한 이유로 행정부는 매우 비효율적으로 운영되고 있습니다. 식민지 시절인 1918년에 제정된 \"윤리 정책\"은 윤리적인 노동 규정을 의무화하고 소수 집단에게 민주적 대표권을 부여함으로써 상황을 개선하고자 했지만, 대공황과 독립으로 인해 대부분 제대로 시행되지 못했습니다."
 RST_memory_of_colony: "식민지의 잔재"
 RST_memory_of_colony_desc: "우리는 독립한지 얼마 안되어 아직 성장할 동력이 존재하지 않습니다. 인재들을 육성해 우리의 성장 기반을 만들어야 합니다."
