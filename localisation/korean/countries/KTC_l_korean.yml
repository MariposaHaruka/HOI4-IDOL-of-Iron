 ###################################################
 # bop
 # MIO/designers
 # idea
 KTC_broken_economy: "망가진 경제"
 KTC_broken_economy_desc: "대장정은 우리의 경제 기반을 망가뜨렸으며, 조폐기도 버리고 왔기 때문에 우리 경제를 다시 살리려면 처음부터 다시 시작해야 합니다."
 KTC_complicated_power: "복잡한 권력"
 KTC_complicated_power_desc: "우리의 권력은 중앙위원회에서 나오지만, 각 파벌의 첨예한 이익 관계 문제로 대립해 권력 구조가 복잡한 상태로 되어있습니다. 강력한 지도자가 나서서 이를 일원화할 필요가 있습니다."
 KTC_long_march: "서북 행군의 여파"
 KTC_long_march_desc: "함선 내전의 양상은 오토노키자카의 개입으로 전혀 다른 국면에 다다르게 되었는데, 이로 인해 우리는 신장 방면으로 머나먼 행군을 떠날 수 밖에 없었습니다. 그 과정에서 우리는 지치고 약해져 있지만, 우세한 적에 맞서 다시 일어나야 합니다.\n\n§R우리는 다시 일어나서 맞서 싸울 것이고, 승리를 쟁취해낼 것입니다!§!"
