 # bop
 # MIO/designers
 # idea
 LPR_mapuche_conflict: "마푸체 분쟁"
 LPR_mapuche_conflict_desc: "아리우카니아 평정으로 지역의 영토와 주민들이 칠레 국가에 강제로 통합된 이후 원주민인 마푸체는 쫓겨나고, 차별받고, 불만을 품게 되었습니다. 그들 중 협력과 통합을 위해 노력하는 이들이 있는 반면, 가능한 모든 방법으로 국가를 전복하고자 투쟁하는 이들도 있습니다."
 LPR_alessandri_plan: "알레산드리 계획"
 LPR_alessandri_plan_desc: "왕권의 방패 아래, 아르투로 알레산드리 총리는 강력한 경제 계획을 시행해 광물에 집중된 플로라 왕국을 개선하려고 시도하고 있습니다. §R하지만 정적들과 시간이 그를 가만히 내버려두고 있지 않습니다.§!"
 LPR_citizen_guard: "플로라 민병대"
 LPR_citizen_guard_desc: "1920년대와 30년대 초반을 거치면서 생긴 정치적 혼란은 왕국의 수호를 위해 결성된 민병대를 통해 어느정도 안정되었고, 이제 이 민병대는 플로라 왕국의 일상이 되었습니다.\n\n하지만 이들은 비정규군인 이상, 정규군의 확장에 지장을 줄 것입니다."
 LPR_great_depression: "대공황"
 LPR_great_depression_desc: "1927년 대공황으로 우리의 광물을 수입하던 국가들이 수입을 중단해 우리 경제는 큰 타격을 입었습니다. 어떻게 해서든 경제를 개선해 대공황을 극복해야 합니다."
