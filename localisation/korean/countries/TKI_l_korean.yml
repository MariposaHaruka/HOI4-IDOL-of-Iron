 # bop
 # MIO/designers
 # idea
 TKI_ganden_podrang: "간덴 포드랑"
 TKI_ganden_podrang_desc: "5대 달라이 라마는 오랜 내전 끝에 경쟁자인 창파 가문을 물리친 후에 겔룩파의 지배 아래 티베트 중심부를 통일하고, 현재 티베트 정부의 모델이 되는 정부를 수립했습니다. 이 정부는 고립주의적이었지만, 그 결과 국가는 더 안정된 상태가 되었습니다.\n\n이후 1918년 티베트 땅에도 아이돌의 바람이 불자, 달라이 라마는 남코 연방의 도움을 받아 아이돌을 받아들였고, 아이돌은 간덴 포드랑의 체제 아래에서 발전해 나갔습니다."
 TKI_isolated_country: "고립 국가"
 TKI_isolated_country_desc: "우리는 남코 연방 덕분에 독립을 유지할 수 있었지만, 다른 어떤 나라로부터 독립국으로 인정받지 못했습니다. 옆의 벽람항로와 칸코레의 전쟁이 가시화되는 시점에서, 우리가 살아남으려면 독립국으로 빨리 인정받는 것이 급선무입니다."
