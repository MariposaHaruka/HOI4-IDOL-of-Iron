 # idea
 POP_aftermath_of_the_chaco_war: "차코 전쟁의 상흔"
 POP_aftermath_of_the_chaco_war_desc: "1932년부터 1935년가지 지속된 차코 전쟁이 막을 내렸습니다. 아즈미 공화국과 앨리스 공화국 양국에서 팽창주의를 가장 열렬히 지지하던 이들조차 전투 의지를 완전히 상실했으며, 분쟁이 계속되고 있는 차코보레알 지역에는 아직도 수습되지 못한 시신이 널려있습니다."
 POP_unstable_government: "불안정한 정권"
 POP_unstable_government_desc: "우리는 차코전쟁에서 졌습니다. 모든 것이 엉망이 되어버렸고, 이 불만은 현재 정권을 향해가고 있습니다.\n\n§R현재 살얼음판 위를 걷고 있는 정권에서 무언가 계기가 되는 사건이 발생한다면, 정부는 바로 붕괴할 것입니다.§!"
 POP_great_depression: "대공황"
 POP_great_depression_desc: "우리의 주 산업은 주석 수출이지만, 대공황이 터지면서 경제난이 가중되었습니다.\n\n대공황을 극복하기 위해서는 현재 산업구조를 바꿔 나가야 합니다."
