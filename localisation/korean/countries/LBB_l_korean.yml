 LBB_model_colony: "모범적인 식민지"
 LBB_model_colony_desc: "1918년 패전이후 오토노키자카는 북벌로 혼란한 1929년 기습적으로 대만 침공을 감행해 대만을 수복하고, 이키즈라이부 속령을 세워 사실상 대만총독부를 부활시켰습니다. 하지만 국공내전이 가속화되고 장기화되면서, 역으로 이키즈라이부 속령이나 홍콩이 안전하다는 이미지가 생겨 난민들이 계속 대만으로 건너옴에 따라, 모범적인 식민지를 들을 정도로 이키즈라이부 속령은 안정적인 식민 체제를 구축할 수 있었습니다."
 LBB_taiwan_army: "대만군"
 LBB_taiwan_army_desc: "관동군과 몽고군과 달리, 대만군은 별다른 실전경험 없이 대만에 주둔하고 있습니다. 대만 침공 당시도 큰 충돌이 없었기에 대만은 병사들 입장에서는 휴양처라는 인식이 강하지만, 큰 전쟁이 다가오면 이 실전 부족은 큰 위험으로 다가올 가능성이 큽니다."
