 # bop
 # MIO/designers
 # idea
 IDP_patagonia_problem: "파타고니아 문제"
 IDP_patagonia_problem_desc: "1920년 파타고니아에서 일어난 반란은 많은 사망자를 발생하고 마무리되었습니다. 하지만 노동자들의 희생과 사회적 갈등은 사라지지 않았으며, 토지 소유자와 노동계 사이의 깊은 불신은 여전히 사회에 상흔으로 남아 있습니다."
 IDP_roca_runciman_treaty: "로카-런시먼 조약"
 IDP_roca_runciman_treaty_desc: "로카-런시먼 조약은 1933년 5월에 서명된 호시미국과 남코 연방 사이의 중요한 무역 협정으로, 남코 연방 육류 시장에서의 호시미국의 고정 지분을 보장했습니다. 그 대가로 호시미국 측은 무역이나 환전과 관련된 제한에 동의하여 남코 연방의 호시미국 국내 상업적 이익을 보존했습니다."
 IDP_political_corruption: "정치 부패"
 IDP_political_corruption_desc: "수년간 호시미 국은 정부 내 극심한 부패로 시달려 왔습니다. 지금 집권중인 호시미당이 그나마 덜 부패한 편이지만, 아직도 호시미국 곳곳에는 부패가 만연합니다. 투표 조작과 유권자에 대한 위협은 지금도 존재합니다."
 IDP_hoshimi_regime: "호시미 체제"
 IDP_hoshimi_regime_desc: "혼란스러웠던 1920년대와 대공황을 지나 호시미당이 집권한 이래 정권이 안정적으로 바뀌고 경제도 어느정도 안정되었지만, 보신주의와 농촌 붕괴 현상은 아직도 현재 진행형으로 일어나고 있습니다."
