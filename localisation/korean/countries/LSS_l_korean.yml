 # bop
 # MIO/designers
 # idea
 LSS_colonial_discontent: "식민 체제에 대한 불만"
 LSS_colonial_discontent_desc: "1910년의 조선 총독부가 산동의 우라노호시 속령이 조선으로 이전하는 방향으로 다시 돌아왔지만, 조선 사람들은 진수부에 이은 또 다른 침략자인 오토노키자카를 쫒아내기 위한 저항이 이어지고 있습니다.\n\n§R거기에, 조선으로의 귀향을 꿈꾸는 오르카 공화국이 전쟁을 천명한 이상, 우라노호시 속령은 어떻게든 이 불만을 억눌러야 합니다.§!"
 LSS_government_general_of_chosen: "조선총독부"
 LSS_government_general_of_chosen_desc: "비록 우라노호시 속령은 오토노키자카의 산둥 반도를 지배하던 식민지 출신이러 조선 반도에 기반이 없는 상황이지만, 조선 총독부 출신 관리들의 도움을 받아 짧은 시간안에 어느정도 안정화된 행정 운영을 하고 있습니다."
 LSS_bridgehead_to_continent: "대륙으로 가는 전진기지"
 LSS_bridgehead_to_continent_desc: "일본 제국 시절부터 조선 반도는 대륙 점령을 위한 발판으로 쓰였습니다. 이는 오토노키자카 공화국의 1933년 조선 침공의 명분으로 다시 한번 쓰였습니다. 조선 반도는 오토노키자카가 대륙으로 향하는 첫번째 관문이 될 것입니다."
