 LCD_political_polarization: "정치적 양극화"
 LCD_political_polarization_desc: "1924년 창당된 나가레가와 혁명인민동맹, 줄여서 APRN은 라틴아메리카의 단결과 제국주의 반대, 그리고 계획경제 도입을 주장해 지식인과 원주민, 소시민의 호응을 얻은 정당입니다. 하지만 대공황 이후 정권이 불안정해지면서 군부와 APRN의 대립이 깊어져갔고, 다가오는 선거에서 APRN은 어떻게든 현 정권을 끌어내리려고, 군부는 어떻게든 현 정권을 유지하려고 합니다.\n\n§R다가오는 선거에서 이 대립이 더 심화된다면, 우리나라에는 내전이 일어날지도 모릅니다.§!"
 LCD_great_depression: "대공황"
 LCD_great_depression_desc: "1927년 런던에서 시작된 대공황은 농업에 의존하는 우리나라를 덮쳐 우리의 부실한 경제를 더욱 부실하게 만들었습니다."
