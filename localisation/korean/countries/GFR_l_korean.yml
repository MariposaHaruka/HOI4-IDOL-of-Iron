 # bop
 # MIO/designers
 # idea
 GFR_foreign_companies: "외국계 기업의 개입"
 GFR_foreign_companies_desc: "유나이티드 프루트 컴퍼니를 비롯한 여러 해외 기업은 우리나라에 플랜테이션 농장을 지어 과일을 수확하고 자기네 나라에 수출하는 체제를 만들었습니다.\n\n§R하지만 이들의 이익이 우리나라에서 보장받지 못하면, 이들은 자신의 이익을 보장해주는 세력으로 정권을 교체해 우리의 정권을 위태롭게 만들지도 모릅니다.§!"
 GFR_seio_national_police: "경찰 국가"
 GFR_seio_national_police_desc: "파나마가 파나마 운하의 건설을 대가로 독립한 국가인 만큼, 미국과 미시로 연방에 의해 독립보장을 받는 대신 경찰만 보유할 수 있도록 조약을 비준한 상태입니다.\n\n하지만 옆의 홀로라이브 세력을 생각하면 좋은 방법이 아닐지도 모릅니다. 미시로 연방은 바다 건너 멀리 있지만, 홀로라이브 합중국은 바로 옆이니까요."
