 LVD_after_golden_legacy: "황금기가 지난 뒤"
 LVD_after_golden_legacy_desc: "우리의 황금기였던 1910년대가 지난 뒤 우리는 계속해서 몰락의 길을 걸어왔고, 멕시코 혁명을 전후해서 우리는 자메이카 섬까지 밀려왔습니다.\n\n§R황금기였던 시절 이후에 남은 건 아무것도 없습니다. 우리는 바닥부터 다시 시작해야 합니다.§!"
 LVD_rump_state: "셋방살이"
 LVD_rump_state_desc: "비록 자메이카 섬 밖에 남지 않았지만, 한때 우리는 카리브 해를 호령하던 지역 강국이었습니다. 다시 지역강국으로 재건하기 위해선, 우리는 작은 자메이카 섬에서 벗어나 다시 옛날 강역을 회복할 준비를 해야 합니다."
