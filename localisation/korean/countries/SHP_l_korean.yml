 SHP_unstable_government: "정치적 불안"
 SHP_unstable_government_desc: "프랑스가 1차대전으로 영향력이 약해진 빈틈을 여러 세력이 메우려 시도했지만 아무도 그 빈틈을 메우는 세력은 없었습니다. 마지막 쿠데타가 1933년이었지만, 아직도 군부는 정부가 마음에 안 들면 쿠데타를 일으켜 전복할 준비가 되어있습니다."
 SHP_poor_country: "빈곤 국가"
 SHP_poor_country_desc: "우리의 모든 인프라는 해외의 자본 대출을 받아 지어진 것이다보니, 진짜 우리가 가진 것은 아무것도 없는 상황입니다. 그나마 남아있던 플랜테이션도 대전쟁과 대공황을 거치면서 축소되었고, §R이제 우리에게 남은 건 없습니다.§!"
