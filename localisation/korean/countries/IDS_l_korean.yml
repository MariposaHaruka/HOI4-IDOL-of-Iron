 # bop
 # MIO/designers
 # idea
 IDS_amsterdam_treaty: "암스테르담 조약"
 IDS_amsterdam_treaty_desc: "1932년 암스테르담에서 열린 남코 연방-서클-세이쇼 3국의 기아나 지방 문제에 관한 협의로 디어리 연방이 탄생했습니다. 이 조약으로 기아나 지방은 하나가 되어 독립을 추구할 수 있게 되었지만, 지역 통합을 위한 진통이 아직도 계속되고 있습니다."
 IDS_great_depression: "대공황"
 IDS_great_depression_desc: "1927년 런던에서 시작된 대공황은 우리 디어리 연방에도 들이닥쳐 우리 경제를 파탄냈습니다. 어떻게든 이 고난을 극복해야 합니다."
 IDS_weak_economy: "약한 경제"
 IDS_weak_economy_desc: "대공황과 별개로 우리의 산업은 다른 어떤 나라와 비교해도 처참할 정도로 빈약한 상황입니다. 금과 석유를 바탕으로 어떻게든 산업을 강화해야 합니다."
 IDS_esequiba_gold: "에세키바 금광"
 IDS_esequiba_gold_desc: "에세키바의 금광은 우리의 중요한 수출 산업입니다. 금이라도 있기 때문에, 지금 우리나라의 경제가 원활하게 돌아가고 있는 상황입니다."
