 # bop
 # MIO/designers
 # idea
 GEC_aftermath_of_the_chaco_war: "차코 전쟁의 상흔"
 GEC_aftermath_of_the_chaco_war_desc: "1932년부터 1935년가지 지속된 차코 전쟁이 막을 내렸습니다. 아즈미 공화국과 앨리스 공화국 양국에서 팽창주의를 가장 열렬히 지지하던 이들조차 전투 의지를 완전히 상실했으며, 분쟁이 계속되고 있는 차코보레알 지역에는 아직도 수습되지 못한 시신이 널려있습니다."
 GEC_unstable_government: "불안정한 정권"
 GEC_unstable_government_desc: "차코전쟁에서 이겼지만, 현재 정권은 인기가 없는 상태입니다. 어쩌면 누군가가 이 틈을 노려 쿠데타를 일으킬지도 모르는 일입니다."
 GEC_old_landlordism: "대지주 체제"
 GEC_old_landlordism_desc: "우리의 주 산업은 농업이지만, 그 기반이 되는 땅은 대지주들이 장악한 상태입니다. 우리의 산업을 발전하려면 먼저 농업의 기반이 되는 토지제도부터 개혁해나가야 합니다."
