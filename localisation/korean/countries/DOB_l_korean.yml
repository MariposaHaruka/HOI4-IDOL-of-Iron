 # bop
 # MIO/designers
 # idea
 DOB_sotokanda_regime: "소토칸다 체제"
 DOB_sotokanda_regime_desc: "멕시코 혁명이 히다카 레이나가 주축인 소토칸다 파벌을 중심으로 한 전음부 세력이 카예스 정부를 축출하는 결과로 끝난 이후, 1929년 처음 합의된 이 체제는 현재 소토칸다 합중국을 지탱하는 큰 주춧돌이 되었습니다.\n\n§R하지만 이 체제에 불만을 가진 사람은 이 나라 안에 아직도 많이 존재하며, 이 체제가 붕괴하는 순간 이 땅에는 다시 한번 피바람이 불어닥칠 것입니다.§!"
 DOB_church_power_1: "무신론 국가"
 DOB_church_power_1_desc: "소토칸다에서의 종교는 더이상 어떠한 의미도 존재하지 않습니다. 소토칸다를 합리주의와 과학의 요새로 만들기 위해 더욱 강력히 압박해야 합니다!"
 DOB_church_power_2: "약화된 교회"
 DOB_church_power_2_desc: "십여년전에 크리스테로들이 교회의 권력을 약화시키려는 시도 때문에 반란을 일으켰으나, 국민들은 지금 세속국가를 받아들일 준비를 하고 있을지도 모릅니다."
 DOB_church_power_3: "고무된 교회"
 DOB_church_power_3_desc: "소토칸다의 가톨릭교회를 짓밟으려는 시도를 멈추었습니다. 사제들에게 약간의 자율성을 허용해, 국가에 미치는 통제력을 존중받고 불안정을 모색하는 시도를 억제할 것입니다."
 DOB_church_power_4: "강력한 교회"
 DOB_church_power_4_desc: "진정한 신앙의 억압을 줄이기 위해 신학교와 교회의 소유권을 복원했지만, 아직 해야 할 일이 많습니다."
 DOB_church_power_5: "가톨릭 국가"
 DOB_church_power_5_desc: "증오스러운 1917년 헌법이 최후를 맞이했습니다. 진정한 신앙의 존엄을 핍박한 지 수십 년, 마침내 신성 교회를 소토칸다의 궁극적 권위이자 도덕임과 동시에 법률로 확립했습니다."
 DOB_oil_concessions: "석유 채굴권"
 DOB_oil_concessions_desc: "외국 기업들은 우리의 석유를 개발하기 위해 기간 대금을 지급하며 정해진 영토의 석유를 자유롭게 채굴할 수 있는 양허 계약을 체결했습니다. 하지만 계약의 대금은 채굴된 석유의 값어치보다 훨씬 적었으며, 기업은 이를 통해 다른 국가에 비해 훨씬 높은 이윤을 얻을 수 있었습니다. 이렇게 우리의 석유 매장량은 실질적으로 외세의 통제 하에 놓이게 되었습니다."
