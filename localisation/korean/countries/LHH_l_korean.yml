 ###################################################
 # bop
 # MIO/designers
 # idea
 LHH_white_army: "백군 망명자"
 LHH_white_army_desc: "환상향 혁명에서 패배한 백군은 적군의 영향력이 미치지 않는 만주와 몽골 땅 일대로 망명을 왔고, 2차 적백내전을 꿈꾸며 다시 고향땅에 돌아가기를 희망하고 있습니다.\n\n오토노키자카 측과 망명자들은 현재 나쁜 관계를 유지하고 있지는 않지만, 이 동상이몽은 언젠가는 무너질 것입니다."
 LHH_mongol_veto: "몽고군 거부권"
 LHH_mongol_veto_desc: "1933년 만주 출병에 이어 창설된 몽고군은 진수부의 붕괴를 가속화하는데 도움을 주었고, 관동군과 더불어 몽고군 역시 몽골 땅에 하스노소라 속령을 만들면서 그들의 꿈의 결실을 이루었습니다. 이들은 이 지역을 지배하고 있으며, 몽고군 장성들의 이익을 우선시하고 있습니다."
