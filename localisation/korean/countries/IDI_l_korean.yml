 IDI_unstable_government: "정치적 불안"
 IDI_unstable_government_desc: "쿠바 시절부터 아이돌 사변 이후의 지금까지, 우리나라는 수시로 쿠데타가 일어나 정부가 전복되는 일이 계속 반복되어 왔습니다. §R아무리 좋은 지도자가 집권해도, 마음에 안들면 쿠데타를 일으켜 정부를 전복하면 그만이니까요.§!"
 IDI_weak_industry: "빈약한 산업"
 IDI_weak_industry_desc: "우리의 산업은 관광과 사탕수수에 크게 의존해 있습니다. 1927년 대공황이 우리 경제에 큰 타격을 입힌 것을 생각하면, 새로운 산업을 육성할 필요가 존재합니다."
