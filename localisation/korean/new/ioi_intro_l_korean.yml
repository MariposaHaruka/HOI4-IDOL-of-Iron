 world_history_header_1: "아이돌의 대두"
 world_history_content_1: "1882년 에티오피아에 마크로스가 건국된 이래, 전 세계에 아이돌의 열풍이 휘몰아쳤습니다. 구세계의 입장에서는 아이돌이란 대체 무엇인지에 대한 동경과 호기심으로, 신세계의 입장에서는 우리의 믿음으로 압제자를 몰아낼 수 있다는 희망으로, 러시아 제국을 시작으로 하나둘 퍼져나가기 시작했습니다. 어느 평범한 정치인들이 그랬듯이 아이돌들도 아무런 세계에 스며들었지만, 그들의 열풍은 전세계를 휩쓸었습니다. 남코 연방과 서클 제2공화국, 홍마-백옥-영원 연합 제국이 등장했고, 이 세 나라를 중심으로 세력이 생겨나기 시작했습니다.\n\n세계 곳곳에 생겨난 아이돌 국가들은 성장하면서 소규모로 충돌하기 시작했습니다. 처음에는 이 충돌이 국지적이고 빈도도 작았지만, 1907년 독일과 오스트리아-헝가리 제국이 통합해 대독일제국이 들어선 이후 이 빈도는 늘어나고 강도도 점차 세졌습니다. 대독일제국을 견제한다는 아래 남코 연방과 서클 제2공화국, 홍마-백옥-영원 연합제국이 협상국이라는 깃발 아래 뭉쳤고, 환상향-일본 전쟁 이후 영일동맹 파기로 동맹이 없어진 일본이 대독일제국과 새롭게 조약을 맺고 동맹국에 합류하면서 두 개의 큰 세력이 생겨났습니다. 일촉즉발의 상황에서 1914년 사라예보 사건이 터졌고, 결국 이는 대전쟁을 불러왔습니다. 그리고 전세계는 4년 동안 유례없는 대전쟁을 겪게 되었습니다."
 world_history_header_2: "대전쟁과 복수의 씨앗"
 world_history_content_2: "금방 끝날 것 같았던 대전쟁은 참호의 늪에 빠지면서 시간은 길어졌습니다. 그 동안 대독일제국은 홍마-백옥-영원 연합제국을 브레스트-리토프스크 조약을 통해 굴복시키는 데에 성공했지만, 1917년 협상국의 대공세로 서부 전선의 균형이 무너져 1918년 2월 베를린이 함락당하면서 항복했습니다.\n\n항복 후의 베르사유 조약에서 대독일제국은 분할과 배상금 둘 중 하나를 요구받았고, 분할을 택한 대독일제국은 결국 산산조각이 나면서 끝내 멸망하고 말았습니다. 바다 건너의 일본 제국도 상하이 조약에서 조선과 대만을 토해야 했던 것은 마찬가지였습니다. 자존심을 구긴 일본은 거기에 1923년 관동대지진으로 더욱 더 큰 혼란에 휩싸였고, 천황가는 결국 폐위되고 오토노키자카 공화국으로 전환되기까지 이르렀습니다.\n\n한편 홍마-백옥-영원 연합제국은 전쟁 도중 제국이 붕괴하면서 도저히 전쟁을 수행할 여력이 없어졌고, 급한 불을 끄기 위해 대독일제국과 브레스트-리토프스크 조약을 체결하면서까지 굴욕을 감수했지만, 혁명이 터지는 것은 막을 수 없었고 결국 같은 해 적백내전이 터지면서 환상향은 내전에 휩싸이게 되었습니다. 이 잔혹한 내전은 8년동안 지속되어 레닌의 뒤를 이은 야쿠모 유카리가 블라디보스토크에서 마지막 백군 세력을 토벌 완료했다고 선포하기까지 오랜 시간이 걸렸습니다. 하지만 모든 백군이 토벌당한 것은 아니었고, 아직도 많은 수의 백군 세력은 환상향 너머에서 암약하며 환상향 소비에트 연방의 전복을 꿈꾸고 있는 상황입니다."
 world_history_header_3: "혼란스러운 아시아"
 world_history_content_3: "대전과 격변의 소용돌이 속에서 일본이 패전해 정세가 안정화되는 줄 알았던 동아시아는 일본이 몰락한 이후 더욱 혼란이 가속화되었습니다.\n\n상하이 조약으로 중화민국은 일본에게 빼앗긴 땅을 돌려받았지만, 반대로 내부의 국민당과 공산당의 대립은 더욱 격해졌습니다. 이글 유니온과 손잡은 국민당은 1925년 1차 북벌을 시도했지만, 북양정부를 붕괴하는데에만 성공했지 완전한 성공을 이루는데엔 실패했습니다. 북양정부도, 이글 유니온도 장악하지 못한 공백의 만주를 진수부가 그 틈을 타서 창춘에서 진수부 소비에트 공화국을 선포하면서 혼란이 가속화되었습니다. 진수부는 대대적으로 북중국을 토벌했고, 살아남은 군벌들은 남경으로 도망쳤습니다. 베이핑까지 노려보려고 했지만, 1929년 이글 유니온에게 베이핑 전투에서 패배해 남북 분단이 더욱 고착화되었습니다.\n\n한편 진수부는 후방의 조선반도에 자리한 오르카 공화국이 눈엣가시라고 판단, 1931년 오르카 침공을 개시했고, 오르카 공화국은 바다 건너 저 멀리 남쪽의 수마트라 섬에서 임시정부를 차리고 복수의 나날을 기다려야 했습니다. 이 소식은 조선 반도 수복을 꿈꾸던 오토노키자카 공화국에 알려져 오토노키자카 공화국이 진군하게 되는 계기가 되었으며, 1932년 오토노키자카 공화국은 조선반도와 만주로 출병을 개시해 조선, 만주, 몽골, 대만을 점령하고 진수부 소비에트 공화국을 서쪽으로 밀어내는데 성공했습니다."
 world_history_header_4: "대공황과 식민제국의 해체, 피어오르는 복수의 싹"
 world_history_content_4: "한편 유렵에서는 협상국의 질서가 영원하리라 예상하고 있었지만, 그 예상이 무참히 깨지는 사건이 발생했습니다. 1927년 런던 증권거래소의 주식 대폭락을 시작으로 촉발한 대공황은 전쟁의 상처가 크게나서 여물고 있던 남코 연방과 서클 제2공화국의 경제를 처참히 부숴버렸고, 이 여파는 곧 전세계에 도미노처럼 몰아치게 되었습니다. 뭐든지 예산을 줄여야 하는 상황에서 식민지를 유지할 예산도 부족해져 식민지에 독립운동의 열풍이 불어닥쳤고, 이 상황은 1930년 스캐퍼플로 수병 반란을 진압하던 남코 연방 정부의 예산 백서를 통해 공식적으로 언급되면서 절정에 이르게 되었습니다. 결국 1931년 남코 연방은 런던에서 열린 제국 회의를 통해 식민지로 남을 지 여부를 모든 식민지에 물었고, 미시로 연방, 밀리언 연방, 츠바사 연방, 사이코 연방, 디어리 연방과 하츠보시 연방을 제외한 나머지 식민지들이 독립을 택하면서 사실상 식민제국이 해체의 수순으로 들어서게 되었습니다. 단 하나의 예외, 인도 식민지는 키보토스 학생해방전선의 독립전쟁으로 남코 연방의 의사와 관계없이 독립을 선포했고, 1934년 키보토스 총학생회를 선포하고 남코 연방과 단교를 선언함에 따라 남코 연방과의 관계를 정리하기에 이르렀습니다.\n\n한편 서클 제2공화국은 1929년 알제리의 시위를 유혈진압한 것이 이듬해 독립전쟁으로 번졌고, 결국 1932년 알제가 마지막으로 함락되면서 타카나시와 아마기리국이 독립을 쟁취하는데 성공했습니다. 이 상황에 놀란 서클 제2공화국은 부랴부랴 다른 해외 식민지에 독립 여부를 물었지만, 서브마리너 연방을 제외한 나머지 모든 식민지들이 독립을 택함에 따라 남코 연방보다 더 비참하게 몰락하고 말았다.\n\n이는 다른 나라들도 예외없이 적용되어 모든 식민 제국들이 식민지를 독립시키게 되는 계기가 되었습니다. 단 하나, 유메노사키국만은 건재해 텐쇼인 에이치의 지휘 아래 리비아를 유지하고 거기에 모자라 1935년 12월 에티오피아를 향해 야욕을 드러내기까지 이르렀습니다.\n\n여덟 조각으로 갈라진 독일의 나라들에는 호시노 이치카가 이끄는 세카이당이 하나씩 정권을 장악해 나갔고, 1935년 11월 독일 땅의 다섯 나라의 정권을 장악해 세카이국 선포를 선언했습니다.\n\n25년전의 일촉즉발이 1936년 지금 다시 재현되고 있습니다. 다시 대전쟁을 피할 수 없다는 것을 확인한 만큼, 각자의 살길을 찾아야 합니다. 단결이 옳을 수도, 아니면 혼자만의 고립주의가 옳을 수도 있지만, 1936년 시점의 우리가 그 정답을 알 수 있는 방법은 없습니다."
 generic_country_intro_header_1: "이 나라의 대략적인 20세기 역사"
